  <script>
    // Render products dynamically
    var productGrid = document.getElementById('product-grid');
    
    products.forEach(function(product) {
      var productCard = document.createElement('div');
      productCard.className = 'bg-[#1C1C1C] rounded-xl shadow-lg overflow-hidden product-card';
      productCard.innerHTML = '<img src="' + product.image + '" alt="' + product.name + '" class="w-full aspect-[4/3] object-cover">' +
        '<div class="p-6">' +
        '<h3 class="text-xl font-bold mb-2 text-[#FFFBEA]">' + product.name + '</h3>' +
        '<p class="text-gray-300 text-sm mb-4">' + product.description + '</p>' +
        '<div class="flex justify-between items-center mb-4">' +
        '<span class="font-bold text-[#FDCB07]">₦' + product.price.toLocaleString() + '</span>' +
        '<span class="text-sm text-gray-400">Min: ' + product.minOrder + '</span>' +
        '</div>' +
        '<button onclick="event.stopPropagation(); addToCart(' + product.id + ')" class="w-full bg-[#FDCB07] text-[#0A0A0A] py-3 rounded-full font-bold hover:bg-[#e6b605] transition-colors">Add to Cart</button>' +
        '</div>';
      productGrid.appendChild(productCard);
    });
    
    // Update cart count
    function updateCartCount() {
      updateCartBadge(cart.getAll().length);
    }
    
    // Add to cart function
    function addToCart(productId) {
      var product = products.find(function(p) {
        return p.id === productId;
      });
      if (product) {
        cart.add(productId, product.minOrder, product.minOrder);
        updateCartCount();
        showToast(product.name + ' added to cart!');
      }
    }
    
    // Initialize cart count on page load
    updateCartCount();
  </script>
