        <a href="cart.html" class="nav-cart" aria-label="Cart">

    </div>
  </header>
  <div id="navigation-overlay" aria-hidden="true"></div>
  <!-- Menu Section -->
  <section class="py-20">
    <div class="container mx-auto px-4">
      <h1 class="text-4xl font-fredoka font-bold text-center mb-12">Our Menu</h1>
      <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

  <!-- Contact Section -->
  <section class="py-16 bg-[#134E4A] text-white contact-section">

          <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <h3 class="font-bold text-[#FFF7ED] mb-1">Call</h3>
          <p class="text-gray-300">08034314148</p>
        </a>
        <a href="https://instagram.com/pawsandco" target="_blank" class="contact-card mb-4 md:mb-0">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          <h3 class="font-bold text-[#FFF7ED] mb-1">Instagram</h3>
          <p class="text-gray-300">@pawsandco</p>
        </a>
        <a href="mailto:hello@pawsandco.test" class="contact-card">
         <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <h3 class="font-bold text-[#FFF7ED] mb-1">Email</h3>
          <p class="text-gray-300">hello@pawsandco.test</p>
        </a>
      </div>
    </div>
  </section>
  <!-- Footer -->
  <footer class="bg-[#0F766E] text-white py-8">
    <div class="container mx-auto px-4 text-center">
      <div class="flex items-center justify-center space-x-3 mb-4">
        <img src="images/logo.png" alt="Paws & Co Logo" class="h-10 w-auto">
        <span class="font-fredoka text-xl font-bold text-[#F97316]">Paws & Co</span>
      </div>
      <div class="text-gray-400 text-sm">
        <div class="footer-contacts">
          <a href="https://instagram.com/pawsandco" target="_blank" rel="noopener" class="footer-link"><svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>@pawsandco</a>
          <a href="mailto:hello@pawsandco.test" class="footer-link"><svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>hello@pawsandco.test</a>
        </div>
        <p class="mt-2">© <span id="copyright-year"></span> Paws & Co. All rights reserved.</p>
      </div>
    </div>
  </footer>
  <script>
    var productGrid = document.getElementById('product-grid');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, function(character) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
      });
    }

    function updateCartCount() {
      updateCartBadge(cart.getAll().length);
    }

    function addToCart(productId) {
      var product = products.find(function(p) {
        return String(p.id) === String(productId);
      });
      if (product) {
        cart.add(productId, 1);
        updateCartCount();
        showToast(product.name + ' added to cart!');
      }
    }

    (async function() {
      var loadedProducts = await window.productsReady;
      productGrid.innerHTML = '';
      if (!loadedProducts.length) {
        productGrid.innerHTML = '<p class="col-span-full text-center">No products are available right now. Please check back soon.</p>';
        return;
      }

      loadedProducts.forEach(function(product) {
        var productCard = document.createElement('div');
        productCard.className = 'bg-white rounded-2xl shadow-md overflow-hidden product-card';
        productCard.innerHTML = '<img src="' + escapeHtml(product.image) + '" alt="' + escapeHtml(product.name) + '" class="w-full aspect-[4/3] object-cover">' +
          '<div class="p-6">' +
          '<h3 class="text-xl font-bold mb-2 text-[#134E4A]">' + escapeHtml(product.name) + '</h3>' +
          '<p class="text-[#134E4A] text-sm mb-4">' + escapeHtml(product.description) + '</p>' +
          '<div class="flex justify-between items-center mb-4">' +
          '<span class="font-bold text-[#F97316]">₦' + Number(product.price).toLocaleString() + '</span>' +
          '</div>' +
          '<button class="w-full bg-[#F97316] text-[#134E4A] py-3 rounded-full font-bold hover:bg-[#EA580C] transition-colors">Add to Cart</button>' +
          '</div>';
        productCard.querySelector('button').addEventListener('click', function(event) {
          event.stopPropagation();
          addToCart(product.id);
        });
        productGrid.appendChild(productCard);
      });
      updateCartCount();
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
